const SUPABASE_KEY='sb_publishable_Yz7FsB9rbjQOlhI2cVfuFg_xwdAtaSH';

const PAPEIS={admin:'Administrador',cuiaba:'Cuiabá',sp:'São Paulo',socio:'Sócio (só visualização)'};
const DESTINOS=['Full Mercado Livre','Full Amazon (FBA)','Outro'];
let sessao=null,perfil=null,aba=null,busca='',filtroRem='rota',D={produtos:[],remessas:[],entradas:[],perfis:[],notas:[],boletos:[],anexosNota:[],vinculos:[]},modoLogin='entrar',carregando=false;

// ---------- utilidades ----------
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fd(s){if(!s)return '—';const p=String(s).slice(0,10).split('-');return `${p[2]}/${p[1]}/${p[0]}`;}
function fts(s){return s?new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';}
function brl(n,dec=2){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:dec});}
function un(n){return Number(n||0).toLocaleString('pt-BR');}
function num(v){const n=parseInt(String(v??'').replace(/\D/g,''),10);return isNaN(n)?0:n;}
function dinheiro(v){let s=String(v??'').trim().replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s);}
function um(x){return Array.isArray(x)?x[0]||null:x||null;}
function val(id){const e=$(id);return e?e.value.trim():'';}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3000);}
function podeCusto(){return perfil&&['admin','cuiaba'].includes(perfil.papel);}
function verCusto(){return perfil&&['admin','cuiaba','socio'].includes(perfil.papel);}
function podeSP(){return perfil&&['admin','sp'].includes(perfil.papel);}
function podeRemessa(){return perfil&&['admin','cuiaba','sp'].includes(perfil.papel);}
function verEstoqueCuiaba(){return verCusto()||podeRemessa();}
function ehAdmin(){return perfil&&perfil.papel==='admin';}
function podeFoto(){return perfil&&['admin','cuiaba','sp'].includes(perfil.papel);}
function foto(p,peq){return `<div class="foto${peq?' p':''}">${p&&p.foto_url?`<img src="${esc(p.foto_url)}" alt="" loading="lazy">`:'📷'}</div>`;}
async function reduzirImagem(file,max=1200){
  if(!/^image\//.test(file.type))throw new Error('Escolha um arquivo de imagem (foto).');
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>er(new Error('Não foi possível abrir esta imagem. Tente tirar a foto de novo.'));i.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));}
  finally{URL.revokeObjectURL(url);}
}
async function enviarFoto(pid,file){
  const blob=await reduzirImagem(file);
  const caminho='p'+pid+'/'+Date.now()+'.jpg';
  const {error}=await sb.storage.from('produtos').upload(caminho,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'31536000'});
  if(error)throw error;
  const url=sb.storage.from('produtos').getPublicUrl(caminho).data.publicUrl;
  const antigo=(D.produtos.find(p=>p.id===pid)||{}).foto_url;
  await rpc('definir_foto',{p_produto:pid,p_url:url});
  apagarFotoAntiga(antigo);
  const p=D.produtos.find(p=>p.id===pid);if(p)p.foto_url=url;
  return url;
}
function apagarFotoAntiga(u){try{const m=String(u||'').match(/\/object\/public\/produtos\/(.+)$/);if(m)sb.storage.from('produtos').remove([decodeURIComponent(m[1])]).then(()=>{},()=>{});}catch(e){}}
function ampliar(u){const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${esc(u)}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d);}
const NOME_OCULTO=['e16d7a8e-f1fd-473b-9da2-ffaeadf7137b']; // Bruno (SP): nome visível só para o administrador
function nomeDe(uid){if(NOME_OCULTO.includes(uid)&&!ehAdmin()&&!(sessao&&sessao.user.id===uid))return '';const p=D.perfis.find(x=>x.user_id===uid);return p?(p.nome||p.email):'';}
function produto(id){return D.produtos.find(p=>p.id===id)||{nome:'(produto)',sku:''};}
function msgErro(e){const m=(e&&(e.message||e.error_description))||'Erro inesperado.';
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada).';
  if(/already registered/i.test(m))return 'Este e-mail já tem conta. Use "Entrar".';
  if(/Password should be/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/row-level security|Unauthorized|not allowed/i.test(m))return 'Seu acesso não permite esta ação.';
  if(/exceeded the maximum allowed size|Payload too large/i.test(m))return 'A foto é grande demais. Tente outra.';

async function carregar(){
  if(carregando)return;carregando=true;
  try{
    const sel='*, remessas_custo(frete,frete_unit), remessa_itens(id,produto_id,qtd_enviada,qtd_recebida, remessa_itens_custo(custo_medio_saida,frete_unit,custo_sp), encaminhamentos(id,qtd,destino,conta,envio,data,obs,criado_por,criado_em)), remessa_anexos(id,nome,caminho,tamanho,criado_por,criado_em)';
    const reqs=[sb.from('produtos').select('id,nome,sku,foto_url,produtos_custo(qtd_cuiaba,custo_medio)').order('nome'),
      sb.from('remessas').select(sel).order('id',{ascending:false}).limit(400),
      sb.from('perfis').select('*').order('nome')];
    if(verCusto()){reqs.push(sb.from('entradas').select('*').order('id',{ascending:false}).limit(2000));
      reqs.push(sb.from('notas').select('*').order('emissao',{ascending:false}).limit(500));
      reqs.push(sb.from('boletos').select('*').order('vencimento').limit(3000));
      reqs.push(sb.from('nota_anexos').select('*').order('id').limit(5000));
      reqs.push(sb.from('nf_vinculos').select('*').limit(5000));}
    if(!verCusto()&&podeRemessa())reqs[0]=Promise.all([sb.from('produtos').select('id,nome,sku,foto_url').order('nome'),sb.rpc('estoque_cuiaba')]).then(([a,b])=>{if(a.error||b.error)return a.error?a:b;const m={};(b.data||[]).forEach(x=>m[x.produto_id]=x.qtd_cuiaba);return {data:a.data.map(p=>({...p,produtos_custo:p.id in m?[{qtd_cuiaba:m[p.id],custo_medio:null}]:[]}))};});
    const pa=ehAdmin()?sb.from('acessos').select('*').order('id',{ascending:false}).limit(800):null;
    const r=await Promise.all(reqs);
    const e=r.find(x=>x.error);if(e)throw e.error;
    D.produtos=r[0].data;D.remessas=r[1].data;D.perfis=ehAdmin()?r[2].data:(r[2].data||[]).filter(p=>!NOME_OCULTO.includes(p.user_id)||p.user_id===sessao.user.id);D.entradas=r[3]?r[3].data:[];D.notas=r[4]?r[4].data:[];D.boletos=r[5]?r[5].data:[];D.anexosNota=r[6]?r[6].data:[];D.vinculos=r[7]?r[7].data:[];
    if(pa){const x=await pa;D.acessos=x.data||[];}
  }catch(e){console.error(e);toast('Não foi possível atualizar os dados.');}
  carregando=false;render();
}

  const gtin=v=>/^\d{8,14}$/.test(v)?v:'';

    const it={n:+d.getAttribute('nItem')||0,codigo:xTxt(p,'cProd'),ean:gtin(xTxt(p,'cEAN'))||gtin(xTxt(p,'cEANTrib')),nome:xTxt(p,'xProd'),ncm:xTxt(p,'NCM'),cfop:xTxt(p,'CFOP'),

      lote:xDesc(p,'nLote'),validade:xDesc(p,'dVal'),info:xTxt(d,'infAdProd')};

  const fat=cobr?xFilho(cobr,'fat'):null;

    emissao:(xTxt(ide,'dhEmi')||xTxt(ide,'dEmi')).slice(0,10),natureza:xTxt(ide,'natOp'),
    fornecedor:xTxt(emit,'xNome'),fantasia:xTxt(emit,'xFant'),cnpj:xTxt(emit,'CNPJ')||xTxt(emit,'CPF'),uf:xTxt(emit,'enderEmit/UF'),cidade:xTxt(emit,'enderEmit/xMun'),
    destinatario:xTxt(dest,'xNome'),cnpjDest:xTxt(dest,'CNPJ')||xTxt(dest,'CPF'),
    vprod:fnum(xTxt(tot,'vProd')),desc:fnum(xTxt(tot,'vDesc')),frete:fnum(xTxt(tot,'vFrete')),seg:fnum(xTxt(tot,'vSeg')),outro:fnum(xTxt(tot,'vOutro')),
    ipi:fnum(xTxt(tot,'vIPI')),st:fnum(xTxt(tot,'vST'))+fnum(xTxt(tot,'vFCPST')),icms:fnum(xTxt(tot,'vICMS')),vnf:fnum(xTxt(tot,'vNF')),
    fatura:fat?{numero:xTxt(fat,'nFat'),original:fnum(xTxt(fat,'vOrig')),desconto:fnum(xTxt(fat,'vDesc')),liquido:fnum(xTxt(fat,'vLiq'))}:null,
    pagamentos:[...inf.getElementsByTagNameNS('*','detPag')].map(d=>({tipo:xTxt(d,'tPag'),valor:fnum(xTxt(d,'vPag'))})),
    protocolo:xDesc(x.documentElement,'nProt'),info:xTxt(inf,'infAdic/infCpl'),itens,dups};
}

async function lerPdfIA(f,prog){
  const ext=((f.name.match(/\.([a-z0-9]{1,5})$/i)||[])[1]||'pdf').toLowerCase();
  const caminho='tmp/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
  prog('📤 Enviando o arquivo…');
  const up=await sb.storage.from('notas').upload(caminho,f,{contentType:f.type||'application/pdf',upsert:false});if(up.error)throw up.error;
  try{
    prog('🔎 Lendo a nota com inteligência artificial… pode levar de 30 segundos a 2 minutos, conforme o tamanho.');
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(SUPABASE_URL+'/functions/v1/ler-nota',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({caminho})});
    if(!r.ok){let m='';try{m=(await r.json()).error;}catch(e){}throw new Error(m||('Falha na leitura ('+r.status+').'));}
    const rd=r.body.getReader(),dec=new TextDecoder();let txt='',t0=Date.now();
    while(true){const {done,value}=await rd.read();if(done)break;txt+=dec.decode(value,{stream:true});
      const it=(txt.match(/\],\[/g)||[]).length;prog('🔎 Lendo a nota… '+(it?it+' item(ns) lidos · ':'')+Math.round((Date.now()-t0)/1000)+'s');}
    if(txt.includes('<<ERRO>>'))throw new Error('A leitura foi interrompida: '+txt.split('<<ERRO>>')[1].slice(0,200));
    const ini=txt.indexOf('{'),fim=txt.lastIndexOf('}');if(ini<0||fim<0)throw new Error('Não consegui ler a nota. Tente um PDF mais nítido.');
    const j=JSON.parse(txt.slice(ini,fim+1));
    return (j.notas||[]).map(notaIAparaD);
  }finally{sb.storage.from('notas').remove([caminho]).then(()=>{},()=>{});}
}

function iniciarConferencia(d,arq,fonte,idx){
  const ja=notaJaLancada(d);
  if(ja){if(NF_LISTA&&fonte==='pdf'&&NF_LISTA.notas.length>1){toast('A NF '+d.numero+' já está no sistema.');return;}throw new Error('Esta nota já foi lançada (NF '+ja.numero+' de '+fd(ja.emissao)+'). Abra ela em "Notas e boletos".');}
  NF={d,arq,fonte,idx,modo:'item',data:hoje(),obs:'',aviso:d.obsLeitura?'Leitura automática do PDF — confira os itens e valores. Observação da leitura: '+d.obsLeitura:(fonte==='pdf'?'Leitura automática do PDF — confira os itens e valores antes de lançar.':''),
    linhas:d.itens.map(it=>{const m=acharProdutoNF(it,d.cnpj);return {it,pid:m.pid,fator:m.fator,como:m.como,lancar:it.qtd>0};}),
    bols:d.dups.map((b,i,a)=>({parcela:b.parcela||((i+1)+'/'+a.length),vencimento:b.vencimento,valor:b.valor}))};
  telaConferirNF();
}
function custoLinhaNF(l){
  const it=l.it,q=it.qtd||0;if(!q)return {qtd:0,custo:0,inteiro:false};
  let base=NF.modo==='item'?it.liq:it.tot;
  if(NF.modo==='boletos'){const sTot=NF.linhas.reduce((s,x)=>s+x.it.tot,0),sB=NF.bols.reduce((s,b)=>s+(+b.valor||0),0);if(sTot>0&&sB>0)base=it.tot*sB/sTot;}
  const fator=Math.max(1,num(l.fator)||1),qe=q*fator;
  return {qtd:Math.round(qe),custo:base/qe,inteiro:Math.abs(qe-Math.round(qe))<0.0001};
}

async function enviarArqNota(nid,f,tipo,bid){
  if(f.size>20*1024*1024)throw new Error('O arquivo '+f.name+' passa de 20 MB.');
  const ext=((f.name.match(/\.([a-z0-9]{1,5})$/i)||[])[1]||'pdf').toLowerCase();
  const caminho='n'+nid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const {error}=await sb.storage.from('notas').upload(caminho,f,{contentType:f.type||(ext==='xml'?'text/xml':'application/pdf'),upsert:false});
  if(error)throw error;
  const {error:e2}=await sb.from('nota_anexos').insert({nota_id:nid,boleto_id:bid||null,tipo,nome:f.name.slice(0,150),caminho,tamanho:f.size});
  if(e2){sb.storage.from('notas').remove([caminho]).then(()=>{},()=>{});throw e2;}
  log('acao','Anexou '+tipo+' na nota #'+nid+': '+f.name);
}
async function abrirArqNota(aid){const x=(D.anexosNota||[]).find(a=>a.id===aid);if(!x)return;
  const w=window.open('','_blank');
  const {data,error}=await sb.storage.from('notas').createSignedUrl(x.caminho,3600,x.tipo==='xml'?{download:x.nome}:undefined);
  if(error||!data){if(w)w.close();toast('Não foi possível abrir o arquivo.');return;}
  if(w)w.location.href=data.signedUrl;else location.href=data.signedUrl;
  log('abriu','Arquivo da nota: '+x.nome);
}
function escolherArquivos(multi){return new Promise(ok=>{const i=document.createElement('input');i.type='file';i.accept='application/pdf,image/*';if(multi)i.multiple=true;
  i.style.display='none';document.body.appendChild(i);i.onchange=()=>{ok([...i.files]);i.remove();};i.click();});}
async function anexarRapido(nid,tipo,bid,multi){const fs=await escolherArquivos(multi);if(!fs.length)return;
  try{toast('Enviando '+(fs.length>1?fs.length+' arquivos':'arquivo')+'…');for(const f of fs)await enviarArqNota(nid,f,tipo,bid);toast(tipo==='boleto'?'Boleto anexado.':'Arquivo anexado.');await carregar();}
  catch(e){toast(msgErro(e));}}
async function anexarBoletosDaNota(nid,arqs){if(!arqs.some(Boolean))return [];const falhas=[];
  const {data}=await sb.from('boletos').select('id').eq('nota_id',nid).order('id');
  for(let i=0;i<arqs.length;i++){const f=arqs[i];if(!f)continue;try{await enviarArqNota(nid,f,'boleto',data&&data[i]?data[i].id:null);}catch(e){falhas.push(f.name);}}
  return falhas;}
const TIPOS_ARQ={xml:'XML da nota',documento:'Documento',boleto:'Boleto',comprovante:'Comprovante de pagamento'};

function baseConf(n,sb_){if(n.modo_custo==='planilha')return +((n.dados&&n.dados.custo_final)||n.valor_total);return n.modo_custo==='item'?(+n.valor_produtos-(+n.desconto||0)):n.modo_custo==='boletos'?sb_:+n.valor_total;}
function conferencia(n){
  const bs=D.boletos.filter(b=>b.nota_id===n.id);const sb_=bs.reduce((s,b)=>s+ +b.valor,0);
  const es=D.entradas.filter(e=>(e.nf||'')===n.numero);const se=es.reduce((s,e)=>s+e.qtd*e.custo_unit,0);
  const ok=v=>Math.abs(v-n.valor_total)<=1;const be=baseConf(n,sb_);
  return {bs,es,sb:sb_,se,be,okB:!bs.length&&n.modo_custo?true:ok(sb_),okE:Math.abs(se-be)<=1,semBol:!bs.length};
}

  const kp=(v,l,neg)=>v?`<div class="kpi"><div class="n">${neg?'− ':''}${brl(v)}</div><div class="l">${l}</div></div>`:'';

function baixarPlanilha(){log('acao','Baixou planilha de notas e boletos');
  const q=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const nb=x=>Number(x||0).toFixed(2).replace('.',',');
  const L=[];const nota=id=>D.notas.find(n=>n.id===id)||{};
  L.push('CONFERÊNCIA DAS NOTAS');L.push(['Emissão','NF','Fornecedor','CNPJ','Valor produtos','Desconto','Total nota','Soma boletos','Qtd boletos','Produtos lançados','Situação'].join(';'));
  D.notas.forEach(n=>{const c=conferencia(n);L.push([fd(n.emissao),n.numero,n.fornecedor,n.cnpj,nb(n.valor_produtos),nb(n.desconto),nb(n.valor_total),nb(c.sb),c.bs.length,nb(c.se),c.okB&&c.okE?'Confere':'Divergência'].map(q).join(';'));});
  L.push('');L.push('BOLETOS');L.push(['Vencimento','Fornecedor','NF','Parcela','Valor','Situação','Pago em'].join(';'));
  D.boletos.forEach(b=>{const n=nota(b.nota_id);L.push([fd(b.vencimento),n.fornecedor,n.numero,b.parcela,nb(b.valor),b.pago?'Pago':(b.vencimento<hoje()?'Vencido':'A vencer'),b.pago_em?fd(b.pago_em):''].map(q).join(';'));});
  L.push('');L.push('PRODUTOS LANÇADOS');L.push(['Data','NF','Produto','SKU','Qtd','Custo unit.','Total','Custo médio após'].join(';'));
  D.entradas.slice().reverse().forEach(e=>{const p=produto(e.produto_id);L.push([fd(e.data),e.nf,p.nome,p.sku,e.qtd,nb(e.custo_unit),nb(e.qtd*e.custo_unit),nb(e.custo_medio_depois)].map(q).join(';'));});
  const blob=new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tibiis-notas-boletos-'+hoje()+'.csv';document.body.appendChild(a);a.click();a.remove();
}

async function carregarWhats(){
  try{const w=await rpc('ler_whatsapp');const s=$('w_status');if(!s)return;
    const ds=(w&&w.destinos)||[];
    s.innerHTML=w&&w.token_ok&&ds.length?`<span class="ok">Ativo · enviando para ${ds.length} número(s)</span>`:'<span class="warn">Falta configurar '+(!(w&&w.token_ok)?'o token':'os números')+'</span>';
    if(w&&w.phone_id&&!$('w_pid').value)$('w_pid').value=w.phone_id;
    ds.forEach((d,i)=>{const e=$('w_d'+(i+1));if(e&&!e.value)e.value=d;});
  }catch(e){}
  try{const l=await rpc('ultimos_envios');const el=$('w_log');if(el)el.innerHTML=(l&&l.length)?l.map(x=>`<div>${fts(x.em)} · ${x.status==200?'<span class="ok">enviado</span>':'<span class="warn">erro '+esc(x.status||'')+'</span> '+esc(x.resposta||'')}</div>`).join(''):'Nenhum envio ainda.';}catch(e){}
}

  const opts=D.produtos.map(p=>`<option value="${esc(p.nome+(p.sku?' · '+p.sku:''))}">`).join('');
  abrir(`<h2>Entrada na Tibiis Atacado</h2><div class="sub">Mercadoria que chegou em Cuiabá. O custo médio é recalculado automaticamente.</div>
  <div class="campo"><label>Produto</label><input id="e_prod" list="dl_prod" placeholder="Busque um produto ou digite um novo"><datalist id="dl_prod">${opts}</datalist></div>
  <div class="campo" id="c_sku"><label>SKU / EAN</label><input id="e_sku"></div>
  <div class="tres"><div class="campo"><label>Quantidade</label><input id="e_qtd" inputmode="numeric"></div>
  <div class="campo"><label>Custo unitário (R$)</label><input id="e_custo" inputmode="decimal" placeholder="0,00"></div>
  <div class="campo"><label>Nota fiscal</label><input id="e_nf"></div></div>
  <div class="duas"><div class="campo"><label>Data</label><input id="e_data" type="date" value="${hoje()}"></div>
  <div class="campo"><label>Observação</label><input id="e_obs"></div></div>
  <div class="campo"><label>Foto do produto <span style="font-weight:400;color:var(--mut)">(opcional)</span></label>
    <input id="e_foto" type="file" accept="image/*"><div class="meta" id="e_fotoinfo"></div></div>
  <div class="total" id="e_prev">Preencha quantidade e custo para ver o novo custo médio.</div>
  <div class="erro"></div>
  <div class="rodape"><button id="cx">Cancelar</button><button id="mais">Salvar e lançar outro</button><button class="primary" id="ok">Salvar entrada</button></div>`);
  const achar=()=>{const t=val('e_prod');return D.produtos.find(p=>(p.nome+(p.sku?' · '+p.sku:''))===t)||D.produtos.find(p=>p.nome.toLowerCase()===t.toLowerCase())||null;};
  const prev=()=>{const p=achar();$('c_sku').classList.toggle('hidden',!!p);
    $('e_fotoinfo').textContent=p&&p.foto_url?'Este produto já tem foto. Se escolher outra, ela substitui a atual.':'';
    const q=num(val('e_qtd')),c=dinheiro(val('e_custo'));const el=$('e_prev');
    if(!q||isNaN(c)){el.textContent=p?'Produto existente: '+p.nome:'Preencha quantidade e custo para ver o novo custo médio.';return;}
    const pc=p?um(p.produtos_custo):null,q0=pc?pc.qtd_cuiaba:0,c0=pc?pc.custo_medio:0;
    const novo=q0>0?(q0*c0+q*c)/(q0+q):c;
    el.innerHTML=`${p?'Estoque atual: '+un(q0)+' un. a '+brl(c0,4)+'<br>':'Produto novo<br>'}Entrando: ${un(q)} un. a ${brl(c,4)} = ${brl(q*c)}<br><b>Novo custo médio: ${brl(novo,4)}</b> · Estoque: ${un(q0+q)} un.`;};
  ['e_prod','e_qtd','e_custo'].forEach(id=>$(id).addEventListener('input',prev));
  $('cx').onclick=fechar;
  const salvar=(cont,btn)=>{const p=achar(),q=num(val('e_qtd')),c=dinheiro(val('e_custo'));
    if(!val('e_prod')){$('modal').querySelector('.erro').textContent='Informe o produto.';return;}
    if(!q||isNaN(c)){$('modal').querySelector('.erro').textContent='Informe quantidade e custo unitário.';return;}
    const arq=$('e_foto').files[0],nome=val('e_prod'),sku=val('e_sku');
    rodar(btn,async()=>{await rpc('registrar_entrada',{p_produto_id:p?p.id:null,p_nome:p?null:nome,p_sku:p?null:sku,p_qtd:q,p_custo:c,p_nf:val('e_nf'),p_data:val('e_data')||hoje(),p_obs:val('e_obs')});
      await carregar();
      if(arq){const alvo=p||D.produtos.find(x=>x.nome.toLowerCase()===nome.toLowerCase());
        try{if(alvo){await enviarFoto(alvo.id,arq);render();}toast(alvo?'Entrada registrada com foto.':'Entrada registrada. Anexe a foto abrindo o produto.');}
        catch(e){toast('Entrada registrada, mas a foto não foi enviada: '+msgErro(e));}}
      else toast('Entrada registrada.');
      if(cont){modalEntrada();}else fechar();});};
  $('ok').onclick=()=>salvar(false,$('ok'));$('mais').onclick=()=>salvar(true,$('mais'));
}

  const ents=D.entradas.filter(e=>e.produto_id===pid).slice(0,8);

  ${rems.length?`<h3>Remessas</h3><div class="scroll"><table class="planilha"><tr><th>Remessa</th><th>Saída</th><th>Situação</th><th class="n">Enviado</th><th class="n">No depósito</th></tr>${rems.slice(0,10).map(({r,i})=>`<tr><td>#${r.id}</td><td>${fd(r.data_saida)}</td><td>${r.status==='em_rota'?'Em rota':'Chegou '+fd(r.data_chegada)}</td><td class="n">${un(i.qtd_enviada)}</td><td class="n">${un(i.disp)}</td></tr>`).join('')}</table></div>`:''}
  <div class="erro"></div><div class="rodape"><button id="cx">Fechar</button></div>`);

  if($('pf_etq'))$('pf_etq').onclick=()=>{const fk=lerPref('tibiis_etq','t5030');abrir(`<h2>Etiquetas — ${esc(p.nome)}</h2><div class="sub">Código ${esc(codigoEtiqueta(p))}</div>
    <div class="duas"><div class="campo"><label>Quantidade</label><input id="pe_q" inputmode="numeric" value="1"></div>
    <div class="campo"><label>Tamanho</label><select id="pe_f">${Object.entries(FORMATOS).map(([k,f])=>`<option value="${k}" ${k===fk?'selected':''}>${f.nome}</option>`).join('')}</select></div></div>
    <div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Imprimir</button></div>`);
    $('cx').onclick=()=>modalProduto(pid);$('pe_f').onchange=()=>gravarPref('tibiis_etq',$('pe_f').value);
    $('ok').onclick=()=>{const n=num(val('pe_q'));if(!n||n>2000){$('modal').querySelector('.erro').textContent='Quantidade entre 1 e 2.000.';return;}imprimirEtiquetas([{p,n}],$('pe_f').value,null);};};

const C128=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function codigoEtiqueta(p){const t=String(p.sku||'').normalize('NFD').replace(/[^\x20-\x7e]/g,'').trim();return t||('P'+p.id);}
function barras(txt){
  const v=[...txt].map(c=>c.charCodeAt(0)-32);let ck=104;v.forEach((x,i)=>ck+=x*(i+1));
  const cod=[104,...v,ck%103,106].map(i=>C128[i]).join('');
  let x=10,r='';[...cod].forEach((w,i)=>{w=+w;if(i%2===0)r+=`<rect x="${x}" y="0" width="${w}" height="40"/>`;x+=w;});
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x+10} 40" preserveAspectRatio="none">${r}</svg>`;
}
const FORMATOS={
  t5030:{nome:'Térmica 50 × 30 mm (1 por etiqueta)',w:50,h:30,a4:false},
  t6040:{nome:'Térmica 60 × 40 mm (1 por etiqueta)',w:60,h:40,a4:false},
  t4025:{nome:'Térmica 40 × 25 mm (1 por etiqueta)',w:40,h:25,a4:false},
  a4:{nome:'Folha A4 com 30 etiquetas (63,5 × 25,4 mm)',w:63.5,h:25.4,a4:true}};
function lerPref(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
function gravarPref(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function imprimirEtiquetas(lista,fmtK,rem){
  const f=FORMATOS[fmtK]||FORMATOS.t5030;const dt=rem?fd(rem.data_saida):'';
  const um_=it=>`<div class="et"><div class="nm">${esc(it.p.nome)}</div><div class="bc">${barras(codigoEtiqueta(it.p))}</div><div class="cd">${esc(codigoEtiqueta(it.p))}</div>${rem?`<div class="rm">Remessa #${rem.id} · ${dt}</div>`:''}</div>`;
  const todas=[];lista.forEach(it=>{for(let i=0;i<it.n;i++)todas.push(um_(it));});
  const fs=Math.max(6.5,f.h*0.27);
  const css=`*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;color:#000}
  .et{width:${f.w}mm;height:${f.h}mm;padding:1.4mm 2mm;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
  .nm{font-size:${fs}pt;font-weight:700;line-height:1.1;max-height:2.25em;overflow:hidden;text-transform:uppercase}
  .bc{flex:1;min-height:0;margin:.8mm 0}.bc svg{width:100%;height:100%;display:block}
  .cd{font-size:${fs*1.05}pt;font-weight:700;text-align:center;letter-spacing:.3px;line-height:1}
  .rm{font-size:${Math.max(5.5,fs*.75)}pt;text-align:center;line-height:1.1;margin-top:.4mm}`+
  (f.a4?`@page{size:A4;margin:12.9mm 7.2mm}.folha{display:grid;grid-template-columns:repeat(3,${f.w}mm);grid-auto-rows:${f.h}mm;column-gap:2.5mm}`
       :`@page{size:${f.w}mm ${f.h}mm;margin:0}.et{page-break-after:always;break-after:page}.et:last-child{page-break-after:auto;break-after:auto}`);
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Etiquetas</title><style>${css}</style></head><body>${f.a4?`<div class="folha">${todas.join('')}</div>`:todas.join('')}</body></html>`;
  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(fr);
  const d=fr.contentWindow.document;d.open();d.write(html);d.close();
  setTimeout(()=>{fr.contentWindow.focus();fr.contentWindow.print();setTimeout(()=>fr.remove(),60000);},400);
  log('acao','Imprimiu '+todas.length+' etiqueta(s)'+(rem?' da remessa #'+rem.id:''));
}
// ---------- etiquetas do Mercado Livre (anexos da remessa) ----------
function etqHTML(r){const a=(r.remessa_anexos||[]).slice().sort((x,y)=>x.id-y.id);
  return `<div class="item"><b>🏷 Etiquetas do Mercado Livre</b>
  ${a.length?a.map(x=>`<div class="enc"><span>📄 ${esc(x.nome)} · ${fts(x.criado_em)}${nomeDe(x.criado_por)?' · '+esc(nomeDe(x.criado_por)):''}</span><span><button class="small" data-anx="${x.id}">Abrir</button>${podeFoto()&&r.status!=='cancelada'?` <button class="small" data-anxdel="${x.id}">Remover</button>`:''}</span></div>`).join(''):'<div class="meta">Nenhuma etiqueta anexada ainda. Emita as etiquetas no Mercado Livre e anexe o arquivo aqui.</div>'}
  ${podeFoto()&&r.status!=='cancelada'?`<input type="file" id="anx_arq" accept="application/pdf,image/png,image/jpeg" multiple hidden><div style="margin-top:8px"><button class="small primary" id="anx_add">📎 Anexar etiqueta</button> <span class="meta">PDF ou imagem, até 20 MB</span></div>`:''}</div>`;}
async function enviarAnexo(rid,f){
  if(f.size>20*1024*1024)throw new Error('O arquivo '+f.name+' passa de 20 MB.');
  const ext=((f.name.match(/\.([a-z0-9]{1,5})$/i)||[])[1]||'pdf').toLowerCase();
  const caminho='r'+rid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const {error}=await sb.storage.from('etiquetas').upload(caminho,f,{contentType:f.type||'application/pdf',upsert:false});
  if(error)throw error;
  const {error:e2}=await sb.from('remessa_anexos').insert({remessa_id:rid,nome:f.name.slice(0,150),caminho,tamanho:f.size});
  if(e2){sb.storage.from('etiquetas').remove([caminho]).then(()=>{},()=>{});throw e2;}
  log('acao','Anexou etiqueta na remessa #'+rid+': '+f.name);
}
async function abrirAnexo(r,aid){const x=(r.remessa_anexos||[]).find(a=>a.id===aid);if(!x)return;
  const w=window.open('','_blank');
  const {data,error}=await sb.storage.from('etiquetas').createSignedUrl(x.caminho,3600);
  if(error||!data){if(w)w.close();toast('Não foi possível abrir o arquivo.');return;}
  if(w)w.location.href=data.signedUrl;else location.href=data.signedUrl;
  log('abriu','Etiqueta da remessa #'+r.id+': '+x.nome);
}
function removerAnexo(r,aid){const x=(r.remessa_anexos||[]).find(a=>a.id===aid);if(!x)return;
  confirmar('Remover a etiqueta?','O arquivo "'+x.nome+'" será apagado da remessa #'+r.id+'. Depois é só anexar de novo, se precisar.','Remover',async()=>{
    const {data,error}=await sb.from('remessa_anexos').delete().eq('id',aid).select('id');
    if(error)throw error;if(!data||!data.length)throw new Error('Você não tem permissão para remover esta etiqueta.');
    sb.storage.from('etiquetas').remove([x.caminho]).then(()=>{},()=>{});
    log('acao','Removeu etiqueta da remessa #'+r.id+': '+x.nome);toast('Etiqueta removida.');await carregar();setTimeout(()=>modalDetalhe(r.id),0);});}

  const it=itensRem(r).map(i=>({p:produto(i.produto_id),q:i.qtd_enviada}));
  const fk=lerPref('tibiis_etq','t5030');
  abrir(`<h2>${nova?'Remessa #'+r.id+' criada! ':''}Etiquetas dos produtos</h2>
  <div class="sub">Uma etiqueta por unidade, com nome, código de barras do SKU/EAN e o número da remessa. Ajuste a quantidade se precisar.</div>
  <div class="campo"><label>Tamanho da etiqueta</label><select id="et_fmt">${Object.entries(FORMATOS).map(([k,f])=>`<option value="${k}" ${k===fk?'selected':''}>${f.nome}</option>`).join('')}</select></div>
  <div class="tab rolar">${it.map((x,i)=>`<div class="lin"><div class="pinfo">${foto(x.p,1)}<div>${esc(x.p.nome)}<div class="meta">${esc(codigoEtiqueta(x.p))}${x.p.sku?'':' <span class="warn" style="font-size:12px">(sem SKU, usa código interno)</span>'} · enviado ${un(x.q)}</div></div></div>
    <input data-et="${i}" inputmode="numeric" value="${x.q}"></div>`).join('')}</div>
  <div class="total" id="et_tot"></div>
  <div class="meta">Na janela de impressão, escolha a impressora de etiquetas e deixe a escala em 100% (sem "ajustar à página").</div>
  <div class="erro"></div><div class="rodape"><button id="cx">${nova?'Agora não':'Voltar'}</button><button class="primary" id="ok">Imprimir etiquetas</button></div>`);
  const tot=()=>{const n=[...$('modal').querySelectorAll('[data-et]')].reduce((s,e)=>s+num(e.value),0);$('et_tot').innerHTML=`<b>${un(n)} etiqueta(s)</b>`+($('et_fmt').value==='a4'?` · ${un(Math.ceil(n/30))} folha(s) A4`:'');return n;};
  tot();$('modal').addEventListener('input',tot);$('et_fmt').onchange=()=>{gravarPref('tibiis_etq',$('et_fmt').value);tot();};
  $('cx').onclick=()=>nova?fechar():modalDetalhe(rid);
  $('ok').onclick=()=>{const n=tot();if(!n){$('modal').querySelector('.erro').textContent='Informe a quantidade de etiquetas.';return;}
    if(n>2000){$('modal').querySelector('.erro').textContent='Máximo de 2.000 etiquetas por vez.';return;}
    const lista=it.map((x,i)=>({p:x.p,n:num($('modal').querySelector(`[data-et="${i}"]`).value)})).filter(x=>x.n>0);
    imprimirEtiquetas(lista,$('et_fmt').value,r);};
}

function modalRemessa(){
  const ps=D.produtos.map(p=>({...p,c:um(p.produtos_custo)})).filter(p=>p.c&&p.c.qtd_cuiaba>0).sort((a,b)=>a.nome.localeCompare(b.nome));
  if(!ps.length){toast('Não há estoque em Cuiabá para enviar.');return;}
  abrir(`<h2>Nova remessa para SP (Carvalima)</h2><div class="sub">Escolha os produtos e quantidades que vão nesta remessa. O restante continua em Cuiabá.</div>
  <div class="tres"><div class="campo"><label>Data de saída</label><input id="r_data" type="date" value="${hoje()}"></div>
  <div class="campo"><label>CT-e / coleta</label><input id="r_cte"></div>
  <div class="campo"><label>Volumes</label><input id="r_vol" inputmode="numeric"></div></div>
  ${verCusto()?`<div class="duas"><div class="campo"><label>Frete Carvalima (R$)</label><input id="r_frete" inputmode="decimal" placeholder="0,00"></div>
  <div class="campo"><label>Buscar produto</label><input id="r_busca" type="search"></div></div>`:`<div class="campo"><label>Buscar produto</label><input id="r_busca" type="search"></div>`}
  <div class="tab rolar">${ps.map(p=>`<div class="lin" data-lin="${p.id}" data-nome="${esc((p.nome+' '+(p.sku||'')).toLowerCase())}"><div class="pinfo">${foto(p,1)}<div><div>${esc(p.nome)}</div>
    <div class="meta">Disponível ${un(p.c.qtd_cuiaba)}${verCusto()?` · custo ${brl(p.c.custo_medio,4)} <span data-csp="${p.id}"></span>`:''}</div></div></div>
    <input data-q="${p.id}" data-max="${p.c.qtd_cuiaba}" data-c="${verCusto()?p.c.custo_medio:0}" inputmode="numeric" placeholder="0"></div>`).join('')}</div>
  <div class="total" id="r_tot">Nenhum produto selecionado.</div>
  <div class="campo"><label>Observação</label><input id="r_obs"></div>
  <div class="erro"></div>
  <div class="rodape"><button id="cx">Cancelar</button><button class="primary" id="ok">Criar remessa</button></div>`);
  const calc=()=>{const its=[...$('modal').querySelectorAll('[data-q]')].map(i=>({pid:+i.dataset.q,q:num(i.value),max:+i.dataset.max,c:+i.dataset.c})).filter(x=>x.q>0);
    const tot=its.reduce((s,x)=>s+x.q,0),fr=dinheiro(val('r_frete'))||0,fu=tot?fr/tot:0;
    $('modal').querySelectorAll('[data-csp]').forEach(s=>{const x=its.find(y=>y.pid===+s.dataset.csp);s.innerHTML=x?`→ <b>custo SP ${brl(x.c+fu,4)}</b>`:'';});
    const exc=its.filter(x=>x.q>x.max);
    $('r_tot').innerHTML=tot?`<b>${un(tot)} unidades</b> em ${its.length} produto(s)${verCusto()?` · Frete ${brl(fr)} ÷ ${un(tot)} = <b>${brl(fu,4)} por unidade</b>`:''}${exc.length?'<div class="warn">Quantidade acima do disponível em '+exc.length+' produto(s).</div>':''}`:'Nenhum produto selecionado.';
    return {its,exc};};
  $('modal').addEventListener('input',e=>{if(e.target.id==='r_busca'){const q=e.target.value.toLowerCase();$('modal').querySelectorAll('[data-lin]').forEach(l=>l.classList.toggle('hidden',!!q&&!l.dataset.nome.includes(q)));}else calc();});
  $('cx').onclick=fechar;
  $('ok').onclick=()=>{const {its,exc}=calc();const er=$('modal').querySelector('.erro');
    if(!its.length){er.textContent='Informe a quantidade de pelo menos um produto.';return;}
    if(exc.length){er.textContent='Há quantidades acima do disponível em Cuiabá.';return;}
    const fr=!verCusto()?null:val('r_frete')?dinheiro(val('r_frete')):0;if(isNaN(fr)){er.textContent='Valor do frete inválido.';return;}
    rodar($('ok'),async()=>{const id=await rpc('criar_remessa',{p_data:val('r_data')||hoje(),p_cte:val('r_cte'),p_volumes:val('r_vol')?num(val('r_vol')):null,p_frete:fr,p_obs:val('r_obs'),p_itens:its.map(x=>({produto_id:x.pid,qtd:x.q}))});
      toast('Remessa #'+id+' criada.');filtroRem='rota';aba='remessas';await carregar();modalDetalhe(id);});};
}

function modalDetalhe(id){log('abriu','Remessa #'+id);
  const r=D.remessas.find(x=>x.id===id);if(!r)return;
  const it=itensRem(r),c=um(r.remessas_custo);
  const linhas=it.map(i=>{const p=produto(i.produto_id);
    const custo=i.custo&&verCusto()?`<div class="meta">Custo Cuiabá ${brl(i.custo.custo_medio_saida,4)} + frete ${brl(i.custo.frete_unit,4)} = <b>custo SP ${brl(i.custo.custo_sp,4)}</b></div>`:'';
    const encs=(i.encaminhamentos||[]).slice().sort((a,b)=>a.id-b.id).map(e=>`<div class="enc"><span>→ <b>${un(e.qtd)}</b> un. ${esc(e.destino)}${e.conta?' ('+esc(e.conta)+')':''}${e.envio?' · envio '+esc(e.envio):''} · ${fd(e.data)}${nomeDe(e.criado_por)?' · '+esc(nomeDe(e.criado_por)):''}${e.obs?' · '+esc(e.obs):''}</span>${podeSP()?`<button class="small" data-desf="${e.id}" data-r="${r.id}">Desfazer</button>`:''}</div>`).join('');
    return `<div class="item"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div class="pinfo" style="align-items:flex-start"><span data-zoom="${esc(p.foto_url||'')}" style="cursor:${p.foto_url?'zoom-in':'default'}">${foto(p,1)}</span><div><b>${esc(p.nome)}</b>${p.sku?' <span class="meta">'+esc(p.sku)+'</span>':''}
      <div class="meta">Enviado <b>${un(i.qtd_enviada)}</b>${r.status==='recebida'?` · Recebido <b>${un(i.qtd_recebida)}</b> · Encaminhado ${un(i.enc)} · <b>No depósito ${un(i.disp)}</b>`:''}</div>
      ${r.status==='recebida'&&i.qtd_recebida!==i.qtd_enviada?`<div class="warn">⚠ Divergência: ${un(i.qtd_enviada-i.qtd_recebida)} un.</div>`:''}${custo}</div></div>
      ${r.status==='recebida'&&i.disp>0&&podeSP()?`<button class="small primary" data-encam="${i.id}" data-r="${r.id}">Encaminhar</button>`:''}</div>${encs}</div>`;}).join('');
  const env=it.reduce((s,i)=>s+i.qtd_enviada,0);
  abrir(`<h2>Remessa #${r.id} ${badgeRem(r.status)}</h2>
  <div class="sub">Saída ${fd(r.data_saida)} pela Carvalima${r.cte?' · CT-e '+esc(r.cte):''}${r.volumes?' · '+un(r.volumes)+' volume(s)':''} · ${un(env)} un.${nomeDe(r.criado_por)?' · por '+esc(nomeDe(r.criado_por)):''}
  ${r.status==='recebida'?`<br>Chegou em SP ${fd(r.data_chegada)}${nomeDe(r.recebido_por)?' · confirmado por '+esc(nomeDe(r.recebido_por)):''}${r.obs_chegada?' · '+esc(r.obs_chegada):''}`:''}
  ${r.obs?'<br>Obs.: '+esc(r.obs):''}</div>
  ${c&&verCusto()?`<div class="total">Frete Carvalima <b>${brl(c.frete)}</b> ÷ ${un(env)} un. = <b>${brl(c.frete_unit,4)} por unidade</b></div>`:''}
  ${r.status!=='cancelada'&&podeCusto()&&(!c||!Number(c.frete))?`<div class="warn" style="display:flex;justify-content:space-between;align-items:center;gap:8px">Frete da Carvalima ainda não lançado.<button class="small primary" id="frt">Lançar frete</button></div>`:''}
  ${etqHTML(r)}${linhas}<div class="erro"></div>
  <div class="rodape">${r.status==='em_rota'&&podeCusto()?`<button class="danger" id="canc">Cancelar remessa</button>`:''}
  ${r.status==='em_rota'&&podeSP()?`<button class="primary" id="cheg">Confirmar chegada</button>`:''}<button id="cx">Fechar</button></div>`);
  $('cx').onclick=fechar;
  if($('cheg'))$('cheg').onclick=()=>modalChegada(r.id);
  if($('frt'))$('frt').onclick=()=>{abrir(`<h2>Frete da remessa #${r.id}</h2><div class="sub">O valor é dividido por unidade e somado ao custo de cada item que chega em SP.</div>
    <div class="campo"><label>Frete Carvalima (R$)</label><input id="f_v" inputmode="decimal" placeholder="0,00"></div><div class="erro"></div>
    <div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Salvar frete</button></div>`);
    $('cx').onclick=()=>modalDetalhe(r.id);
    $('ok').onclick=()=>{const v=dinheiro(val('f_v'));if(isNaN(v)||v<0){$('modal').querySelector('.erro').textContent='Valor do frete inválido.';return;}
      rodar($('ok'),async()=>{await rpc('definir_frete',{p_remessa:r.id,p_frete:v});toast('Frete lançado.');await carregar();modalDetalhe(r.id);});};};
  $('modal').querySelectorAll('[data-anx]').forEach(b=>b.onclick=()=>abrirAnexo(r,+b.dataset.anx));
  $('modal').querySelectorAll('[data-anxdel]').forEach(b=>b.onclick=()=>removerAnexo(r,+b.dataset.anxdel));
  if($('anx_add')){$('anx_add').onclick=()=>$('anx_arq').click();
    $('anx_arq').onchange=()=>{const fs=[...$('anx_arq').files];if(!fs.length)return;const b=$('anx_add');b.textContent='Enviando…';
      rodar(b,async()=>{try{for(const f of fs)await enviarAnexo(r.id,f);}catch(e){b.textContent='📎 Anexar etiqueta';$('anx_arq').value='';throw e;}
        toast(fs.length>1?fs.length+' arquivos anexados.':'Etiqueta anexada.');await carregar();modalDetalhe(r.id);});};}
  if($('canc'))$('canc').onclick=()=>confirmar('Cancelar a remessa #'+r.id+'?','As quantidades voltam para o estoque de Cuiabá.','Cancelar remessa',async()=>{await rpc('cancelar_remessa',{p_remessa:r.id});toast('Remessa cancelada.');await carregar();});
  $('modal').querySelectorAll('[data-encam]').forEach(b=>b.onclick=()=>modalEncaminhar(+b.dataset.r,+b.dataset.encam));
  $('modal').querySelectorAll('[data-zoom]').forEach(b=>{if(b.dataset.zoom)b.onclick=()=>ampliar(b.dataset.zoom);});
  $('modal').querySelectorAll('[data-desf]').forEach(b=>b.onclick=()=>rodar(b,async()=>{await rpc('desfazer_encaminhamento',{p_id:+b.dataset.desf});toast('Encaminhamento desfeito.');await carregar();modalDetalhe(+b.dataset.r);}));
}

function modalChegada(rid){
  const r=D.remessas.find(x=>x.id===rid),it=itensRem(r);
  abrir(`<h2>Confirmar chegada — Remessa #${r.id}</h2><div class="sub">Confira quanto chegou de cada produto no depósito de SP. Se chegou tudo, é só confirmar.</div>
  <div class="tab">${it.map(i=>`<div class="lin"><div class="pinfo">${foto(produto(i.produto_id),1)}<div>${esc(produto(i.produto_id).nome)}<div class="meta">Enviado ${un(i.qtd_enviada)}</div></div></div>
    <input data-rec="${i.id}" inputmode="numeric" value="${i.qtd_enviada}"></div>`).join('')}</div>
  <div class="duas"><div class="campo"><label>Data de chegada</label><input id="c_data" type="date" value="${hoje()}"></div>
  <div class="campo"><label>Observação (avarias, faltas…)</label><input id="c_obs"></div></div>
  <div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Confirmar chegada</button></div>`);
  $('cx').onclick=()=>modalDetalhe(rid);
  $('ok').onclick=()=>rodar($('ok'),async()=>{
    const itens=[...$('modal').querySelectorAll('[data-rec]')].map(i=>({item_id:+i.dataset.rec,qtd:num(i.value)}));
    await rpc('confirmar_chegada',{p_remessa:rid,p_data:val('c_data')||hoje(),p_itens:itens,p_obs:val('c_obs')});
    toast('Chegada confirmada.');await carregar();modalDetalhe(rid);});
}

function modalEncaminhar(rid,iid){
  const r=D.remessas.find(x=>x.id===rid),i=itensRem(r).find(x=>x.id===iid),p=produto(i.produto_id);
  abrir(`<h2>Encaminhar mercadoria</h2><div class="sub">${esc(p.nome)} — ${un(i.disp)} un. no depósito SP (remessa #${rid}).</div>
  <div class="campo"><label>Para onde foi?</label><select id="n_dest">${DESTINOS.map(d=>`<option>${d}</option>`).join('')}</select></div>
  <div class="campo hidden" id="c_outro"><label>Qual destino?</label><input id="n_outro"></div>
  <div class="duas"><div class="campo"><label>Quantidade</label><input id="n_qtd" inputmode="numeric" value="${i.disp}"></div>
  <div class="campo"><label>Conta / loja</label><input id="n_conta" placeholder="ex.: Nexxcompany"></div></div>
  <div class="duas"><div class="campo"><label>Nº do envio / agendamento</label><input id="n_envio"></div>
  <div class="campo"><label>Data</label><input id="n_data" type="date" value="${hoje()}"></div></div>
  <div class="campo"><label>Observação</label><input id="n_obs"></div>
  <div class="meta">Se encaminhar só uma parte, o restante continua no depósito.</div>
  <div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Confirmar</button></div>`);
  $('n_dest').onchange=()=>$('c_outro').classList.toggle('hidden',$('n_dest').value!=='Outro');
  $('cx').onclick=()=>modalDetalhe(rid);
  $('ok').onclick=()=>{const dest=$('n_dest').value==='Outro'?val('n_outro'):$('n_dest').value;const q=num(val('n_qtd'));const er=$('modal').querySelector('.erro');
    if(!dest){er.textContent='Informe o destino.';return;}if(!q||q>i.disp){er.textContent='A quantidade deve ser entre 1 e '+i.disp+'.';return;}
    rodar($('ok'),async()=>{await rpc('encaminhar',{p_item:iid,p_qtd:q,p_destino:dest,p_conta:val('n_conta'),p_envio:val('n_envio'),p_data:val('n_data')||hoje(),p_obs:val('n_obs')});
      toast('Encaminhamento registrado.');await carregar();modalDetalhe(rid);});};
}

function confirmar(t,txt,btn,fn){
  abrir(`<h2>${esc(t)}</h2><div class="sub">${esc(txt)}</div><div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">${esc(btn)}</button></div>`);
  $('cx').onclick=fechar;$('ok').onclick=()=>rodar($('ok'),async()=>{await fn();fechar();});
}

// ---------- eventos ----------
$('app').addEventListener('click',async e=>{
  const t=e.target.closest('[data-aba],[data-act],[data-fr],[data-rem],[data-nota],[data-bol],[data-prod],[data-arqn],[data-anxnota],[data-anxbol],[data-fb],[data-vn],[data-fn]');if(!t)return;
  if(t.dataset.vn||t.dataset.fb||t.dataset.fn){if(t.dataset.vn)vistaNotas=t.dataset.vn;if(t.dataset.fb){filtroBol=t.dataset.fb;vistaNotas='boletos';}if(t.dataset.fn)filtroNF=t.dataset.fn;render();return;}
  if(t.dataset.prod){modalProduto(+t.dataset.prod);return;}
  if(t.dataset.arqn){abrirArqNota(+t.dataset.arqn);return;}
  if(t.dataset.anxnota){anexarRapido(+t.dataset.anxnota,'documento',null,true);return;}
  if(t.dataset.anxbol){anexarRapido(+t.dataset.anxbn,'boleto',+t.dataset.anxbol,false);return;}
  if(t.dataset.nota){modalNota(+t.dataset.nota);return;}
  if(t.dataset.bol){t.disabled=true;try{await rpc('marcar_boleto',{p_id:+t.dataset.bol,p_pago:t.dataset.pg==='1'});await carregar();}catch(err){toast(msgErro(err));t.disabled=false;}return;}
  if(t.dataset.aba){aba=t.dataset.aba;busca='';log('aba',t.textContent.trim());render();return;}
  if(t.dataset.fr){filtroRem=t.dataset.fr;render();return;}
  if(t.dataset.rem){modalDetalhe(+t.dataset.rem);return;}
  const a=t.dataset.act;
  if(a==='sair')sb.auth.signOut();
  if(a==='atualizar'){await carregar();toast('Atualizado.');}
  if(a==='entrada')modalEntrada();
  if(a==='remessa')modalRemessa();
  if(a==='novanota')modalNovaNota();
  if(a==='entradanf')modalEntradaNF();
  if(a==='planilha')baixarPlanilha();
  if(a==='salvarwhats'){t.disabled=true;try{await rpc('salvar_whatsapp',{p_phone_id:val('w_pid'),p_token:$('w_tok').value,p_destinos:[1,2,3,4].map(i=>val('w_d'+i)).filter(Boolean)});$('w_tok').value='';toast('Configuração salva.');await carregarWhats();}catch(err){toast(msgErro(err));}t.disabled=false;}
  if(a==='ativarnum'){t.disabled=true;try{await rpc('ativar_numero',{p_pin:$('w_pin').value});$('w_pin').value='';toast('Pedido de ativação enviado. Veja o resultado em Últimos envios.');setTimeout(carregarWhats,4000);}catch(err){toast(msgErro(err));}t.disabled=false;}
  if(a==='testewhats'){t.disabled=true;try{await rpc('testar_whatsapp');toast('Teste enviado. Confira os celulares.');setTimeout(carregarWhats,4000);}catch(err){toast(msgErro(err));}t.disabled=false;}
});
$('app').addEventListener('input',e=>{if(e.target.id==='busca'){busca=e.target.value;render();}});
$('app').addEventListener('change',async e=>{if(e.target.id==='filtroAc'){filtroAc=e.target.value;render();return;}const s=e.target.closest('[data-papel]');if(!s)return;
  try{await rpc('definir_papel',{p_user:s.dataset.papel,p_papel:s.value||null});toast('Acesso atualizado.');await carregar();}
  catch(err){toast(msgErro(err));await carregar();}});

iniciar();
</script>
</body>
</html>
